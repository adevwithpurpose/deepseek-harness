# Example settings.yaml for DeepSeek Harness
# Location on target machine: ~/.dsh/settings.yaml
# (e.g. C:/Users/<username>/.dsh/settings.yaml or ~/.dsh/settings.yaml)

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

llm-pi-ai:
  providers:
    # Example 1: Local OmniRoute Proxy (OpenAI completions format)
    omniroute:
      displayName: OmniRoute
      api: openai-completions
      baseURL: http://127.0.0.1:20128/v1
      apiKeyEnv: OMNIROUTE_API_KEY
      timeoutMs: 120000
      streamIdleTimeoutMs: 300000
      retryPolicy:
        mode: normal
        maxRetries: 3
      models:
        - id: oc/big-pickle
          name: oc/Big Pickle
          contextWindow: 200000
          maxTokens: 32000
        - id: antigravity/gemini-3.6-flash-high
          name: Gemini 3.6 Flash (High)
          contextWindow: 1048576
          maxTokens: 65536
        - id: cx/gpt-5.6-sol-medium
          name: GPT-5.6 Sol Medium
          contextWindow: 1048576
          maxTokens: 65536

